name: USCIS Case Status Tracker

on:
  schedule:
    - cron: '0 */5 * * *'  # runs every 5 hours
  workflow_dispatch:       # allows manual trigger

jobs:
  check-status:
    runs-on: ubuntu-22.04   # use 22.04 - avoids libasound2 issue on 24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium browser
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run USCIS tracker
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python tracker.py

      - name: Commit updated status file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_status.json || true
          git diff --cached --quiet || git commit -m "chore: update last_status.json [skip ci]"
          git push || true
